<h1>Vehicles</h1>

<p>Count: {{ vehicles().length }}</p>

@for (vehicle of vehicles(); track vehicle.id) {
<div>

    <img [src]="'http://localhost:3000/images/' + vehicle.imageUrl" [alt]="vehicle.name">
    <h1>{{ vehicle.name }}</h1>
    <p>{{ vehicle.manufacturer }}</p>
    <p>{{ vehicle.price }}</p>
</div>
}
