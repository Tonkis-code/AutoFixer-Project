@if (vehicles().length > 0) {
<app-hero [vehicles]="vehicles()" />
}

<app-vehicle-classes />

<section class="featured-vehicles">
    <h2>FEATURED VEHICLES</h2>

    <div class="vehicle-grid">

        @for (vehicle of vehicles(); track vehicle.id) {
        <div>
            <app-vehicle-card [vehicle]="vehicle" />
        </div>
        }

    </div>
</section>
