<header>
    <a routerLink="/" class="logo" [class.menu-open]="menuOpen()">AutoFixer</a>

    <div class="header-actions">
        <button class="cart-button" aria-label="Shopping cart">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 7H6" />
                <circle cx="10" cy="20" r="1" />
                <circle cx="18" cy="20" r="1" />
            </svg>
        </button>

        <button class="menu-button" (click)="menuOpen.set(!menuOpen())" aria-label="Open menu">
            ☰
        </button>
    </div>
</header>

<nav class="nav-menu" [class.open]="menuOpen()">
    <a routerLink="/" class="menu-logo" (click)="menuOpen.set(false)">AutoFixer</a>
    <div class="menu-search">
        <input type="text" placeholder="Search vehicles" #searchInput (keydown.enter)="search(searchInput.value)">
        <button aria-label="Search" (click)="search(searchInput.value)">→</button>
    </div>
    <p class="menu-label">NAVIGATION</p>

    <div class="menu-links">
        <a href="#">
            <span>Vehicle Classes</span>
            <span>→</span>
        </a>
        <a href="#">
            <span>Admin</span>
            <span>→</span>
        </a>
    </div>

    <div class="menu-bottom">
        <p>NIGHT CITY VEHICLE MARKETPLACE</p>
        <span>© 2026 AutoFixer</span>
    </div>
</nav>
